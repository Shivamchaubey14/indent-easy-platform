"""
Indent Easy — GraphQL API contract (initial, v1.2 — WhatsApp removed per DEC-001; live-confirmed Sale & Stock Report, STN post, stock condition, sale to other, SAP order generator).
Source of truth for server resolver types and client operations (GraphQL Code Generator).
Conventions: Relay connections, input objects, payload types with userErrors,
opaque global IDs, Decimal as string, DateTime RFC 3339 UTC, Date ISO-8601 (business TZ Asia/Kolkata).
Authorization: @auth documents the required permission; enforcement happens in application policies.
"""
schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ---------------------------------------------------------------------------
# Directives
# ---------------------------------------------------------------------------

"Required permission code (resource:action). Enforced server-side by policies; documented here for clients and codegen."
directive @auth(requires: String!) on FIELD_DEFINITION | OBJECT

"Field contains personal or sensitive data; masked unless caller holds the matching *:read_sensitive permission."
directive @sensitive on FIELD_DEFINITION

"Mutation requires an idempotency key (Idempotency-Key header or input.idempotencyKey)."
directive @idempotent on FIELD_DEFINITION

"Query cost hint for the complexity limiter."
directive @cost(weight: Int!, multipliers: [String!]) on FIELD_DEFINITION

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

"Arbitrary-precision decimal serialised as a string, e.g. \"1250.50\"."
scalar Decimal
"RFC 3339 timestamp in UTC, e.g. 2026-09-24T05:30:00Z."
scalar DateTime
"ISO-8601 calendar date, e.g. 2026-09-24 (business time zone Asia/Kolkata)."
scalar Date
"E.164 phone number, e.g. +919876543210."
scalar PhoneNumber
"RFC 5322 e-mail address."
scalar EmailAddress
"JSON value (used only for configuration payloads)."
scalar JSON
"ISO 4217 currency code."
scalar CurrencyCode
"Client-generated UUID used for idempotency and offline correlation."
scalar UUID

# ---------------------------------------------------------------------------
# Core interfaces & shared types
# ---------------------------------------------------------------------------

interface Node {
  "Opaque global ID."
  id: ID!
}

interface Auditable {
  createdAt: DateTime!
  createdBy: UserRef
  updatedAt: DateTime
  updatedBy: UserRef
  version: Int!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input PaginationInput {
  "Max 100, default 20."
  first: Int
  after: String
  last: Int
  before: String
}

enum SortDirection {
  ASC
  DESC
}

input DateRangeInput {
  from: Date
  to: Date
}

input DateTimeRangeInput {
  from: DateTime
  to: DateTime
}

type Money {
  amount: Decimal!
  currency: CurrencyCode!
}

type Quantity {
  value: Decimal!
  uom: Uom!
}

"Expected business/validation error returned in mutation payloads."
type UserError {
  "Stable machine-readable code, e.g. INVENTORY_INSUFFICIENT."
  code: ErrorCode!
  message: String!
  "Path to the offending input field, e.g. [\"input\",\"lines\",\"2\",\"quantity\"]."
  field: [String!]
  details: JSON
}

enum ErrorCode {
  VALIDATION_FAILED
  NOT_FOUND
  FORBIDDEN
  CONFLICT
  INVALID_STATE_TRANSITION
  VERSION_CONFLICT
  IDEMPOTENCY_KEY_REUSED
  RATE_LIMITED
  AUTH_INVALID_CREDENTIALS
  AUTH_ACCOUNT_LOCKED
  AUTH_ACCOUNT_DISABLED
  AUTH_TOKEN_EXPIRED
  AUTH_MFA_REQUIRED
  INDENT_ALREADY_SUBMITTED
  INDENT_DUPLICATE_LINE
  APPROVER_NOT_RESOLVED
  WORKFLOW_NOT_CONFIGURED
  APPROVAL_ALREADY_ACTED
  APPROVAL_NOT_ASSIGNED
  TRANSFER_SOURCE_INVALID
  PO_QUANTITY_EXCEEDS_APPROVED
  PO_DUPLICATE_EXTERNAL_NUMBER
  PO_NOT_OPEN
  SAP_PO_PRODUCT_MISMATCH
  GRN_OVER_TOLERANCE
  GRN_DOCUMENT_REQUIRED
  GRN_DUPLICATE_CHALLAN
  GRN_REVERSAL_EXCEEDS_STOCK
  INVENTORY_INSUFFICIENT
  STN_NOT_DISPATCHED
  STN_RECEIPT_EXCEEDS_DISPATCH
  PRODUCT_NOT_FOUND
  PRODUCT_INACTIVE
  CYCLE_NOT_ACTIVE
  CYCLE_CLOSED
  CYCLE_OVERLAP
  CYCLE_OUT_OF_MONTH
  CYCLE_NOT_OPEN
  MONTH_LOCKED
  STATEMENT_FINALIZED
  FILE_CYCLE_MISMATCH
  COLUMN_NOT_OPEN
  POD_VERIFICATION_FAILED
  POD_ALREADY_UPLOADED
  RECONCILIATION_COLUMNS_MISSING
  RECONCILIATION_DUPLICATE_FILE
  INVOICE_DUPLICATE
  DOCUMENT_TOO_LARGE
  DOCUMENT_TYPE_NOT_ALLOWED
  DOCUMENT_NOT_AVAILABLE
  EXTERNAL_SERVICE_UNAVAILABLE
  INTERNAL_ERROR
}

"Lightweight user reference for display."
