  idempotencyKey: UUID
  locationId: ID!
  departmentId: ID
  requestedForEmployeeCode: String
  priority: Priority = NORMAL
  requiredBy: Date
  justification: String
  budgetCode: String
  remarks: String
  lines: [IndentLineInput!]!
  attachmentDocumentIds: [ID!]
  "When true the indent is submitted in the same call (offline sync path)."
