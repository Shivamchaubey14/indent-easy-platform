}

type AuditEntryConnection {
  edges: [AuditEntryEdge!]!
  pageInfo: PageInfo!
  totalCount: Int
}

input AuditFilter {
  entityType: String
  entityId: ID
  actorId: ID
  action: String
  requestId: String
