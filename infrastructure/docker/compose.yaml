# Local development services for Indent Easy.
# Run from the repo root:  pnpm infra:up   (or: docker compose -f infrastructure/docker/compose.yaml up -d)
# Docker Desktop keeps its disk image on D:\Docker\wsl, so all volumes below live on D:.
name: indent-easy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indent_easy
      POSTGRES_USER: ie
      POSTGRES_PASSWORD: ie_local_only
      IE_APP_PASSWORD: ie_app_local_only
      TZ: Asia/Kolkata
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on an empty volume: gives the app role a login. Schema changes are applied by
      # `pnpm db:migrate`, the same way as in DEV/QA/PROD.
      - ../../database/init:/docker-entrypoint-initdb.d:ro
      - ../../database/checks:/checks:ro
      - ../../database/seeds:/seeds:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ie -d indent_easy']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      # 6380 on the host: a legacy Windows Redis 3.2 service may hold 6379.
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # quay.io/minio stopped anonymous pulls after Sep 2025; Chainguard builds MinIO from source. It
  # runs as UID 65532, so minio-volume first gives it the data volume. Buckets, versioning and
  # expiry are set by `pnpm storage:setup` (run by `pnpm infra:up`).
  minio:
    image: cgr.dev/chainguard/minio@sha256:6a1d0b45c8669726bba580ced0bfa4cb9fdeed1ed636dfabd81d1577beb6937b
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ie_minio
      MINIO_ROOT_PASSWORD: ie_minio_local_only
    ports:
      - '9000:9000'
    volumes:
      - miniodata:/data
    depends_on:
      minio-volume:
        condition: service_completed_successfully

  minio-volume:
    image: alpine:3.22
    command: ['chown', '-R', '65532:65532', '/data']
    volumes:
      - miniodata:/data

  # Catches all outgoing e-mail locally. Web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # HTML -> PDF renderer used by the worker for GRN/STN/receipt PDFs.
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - '3000:3000'
    profiles: ['pdf']

  # Malware scanning of uploads (clamd). Needs about 1 GB of memory; opt-in on the laptop.
  clamav:
    image: clamav/clamav:1.4
    ports:
      - '3310:3310'
    profiles: ['scan']

volumes:
  pgdata:
  redisdata:
  miniodata:
