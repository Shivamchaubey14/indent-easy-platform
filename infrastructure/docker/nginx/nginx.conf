# Indent Easy web tier: serves the SPA and proxies API paths to two API replicas.
# Runs as the unprivileged nginx user on a read-only root filesystem (only /tmp is writable).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status","request_id":"$request_id"}';
  access_log /dev/stdout json;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;

  # Docker's embedded DNS. Replicas get a new address when they are recreated during a deploy,
  # so upstream names are re-resolved every few seconds instead of once at startup.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream api {
    zone api 64k;
    server api-a:8080 resolve max_fails=1 fail_timeout=5s;
    server api-b:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
  }

  map $http_x_request_id $req_id {
    default $http_x_request_id;
    '' $request_id;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The web tier's own liveness; says nothing about the API.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # API paths. While one replica restarts during a deploy, requests go to the other: a refused
    # connection means nothing was sent, so even POSTs are safe to try on the next server.
    location ~ ^/(graphql|api/|health/|\.well-known/) {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $req_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    # Everything else is the SPA; index.html must always be revalidated so new releases load.
    location / {
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      try_files $uri /index.html;
    }
  }
}
