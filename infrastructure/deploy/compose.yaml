# Indent Easy stack for one environment VM (DEV, QA or PROD), installed at /opt/indent-easy.
#
#   web (NGINX, port 80) ──► api-a ┐
#                          └► api-b ┴─► postgres, redis
#
# Never started by hand in normal operation. The deploy agent (deploy.sh) reads .env (this
# environment's secrets, generated on the VM, never in Git) and release.env (the exact image
# digests being deployed). It runs the migrator, then replaces api-a, api-b and web one at a
# time, so there is always a replica serving.
name: indent-easy

x-api: &api
  image: ${IE_API_IMAGE:?IE_API_IMAGE must be set by the deploy agent (release.env)}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m
  environment:
    NODE_ENV: production
    APP_ENV: ${APP_ENV:?}
    PORT: '8080'
    METRICS_PORT: '9464'
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
    DATABASE_URL: postgres://ie_app:${IE_APP_PASSWORD}@postgres:5432/indent_easy
    DATABASE_POOL_MAX: '5'
    REDIS_URL: redis://redis:6379
    S3_BUCKET_DOCUMENTS: ie-documents
    S3_BUCKET_EXPORTS: ie-exports
    S3_BUCKET_IMPORTS: ie-imports
    S3_BUCKET_QUARANTINE: ie-quarantine
    JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:?}
    CSRF_SECRET: ${CSRF_SECRET:?}
    SMTP_HOST: ${SMTP_HOST:-localhost}
    SMTP_PORT: ${SMTP_PORT:-25}
    MAIL_FROM: ${MAIL_FROM:-Indent Easy <no-reply@indent-easy.local>}
    GRAPHQL_INTROSPECTION: ${GRAPHQL_INTROSPECTION:-false}
    GRAPHQL_PERSISTED_ONLY: ${GRAPHQL_PERSISTED_ONLY:-false}
    MIN_MOBILE_VERSION: ${MIN_MOBILE_VERSION:-}
    LOG_LEVEL: ${LOG_LEVEL:-info}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    # Ready = database, Redis and migrations OK (the image's own HEALTHCHECK is only liveness).
    test:
      [
        'CMD',
        '/nodejs/bin/node',
        '-e',
        "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    start_period: 20s
    retries: 6
  stop_grace_period: 45s
  mem_limit: 384m

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: indent_easy
      POSTGRES_USER: ie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      IE_APP_PASSWORD: ${IE_APP_PASSWORD:?}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Gives the app role its login on first start of an empty volume.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ie -d indent_easy']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    shm_size: 128m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '96mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 128m

  # One-shot, run by the agent with `docker compose run --rm migrate` before the API is replaced.
  # The `jobs` profile keeps plain `up` from starting it.
  migrate:
    image: ${IE_API_IMAGE:?}
    profiles: ['jobs']
    command: ['dist/migrate.js']
    read_only: true
    environment:
      MIGRATION_DATABASE_URL: postgres://ie:${POSTGRES_PASSWORD}@postgres:5432/indent_easy
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m

  api-a:
    <<: *api

  api-b:
    <<: *api

  # Outbox relay, event consumers and maintenance jobs. Same image as the API; health and
  # metrics on 9464.
  worker:
    <<: *api
    command: ['dist/worker.js']
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:9464/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 6
    mem_limit: 256m

  # Leader-elected: registers the maintenance schedules. Only one instance acts at a time.
  scheduler:
    <<: *api
    command: ['dist/scheduler.js']
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:9464/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 6
    mem_limit: 160m

  web:
    image: ${IE_WEB_IMAGE:?IE_WEB_IMAGE must be set by the deploy agent (release.env)}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101
    ports:
      - '80:8080'
    # No depends_on: NGINX re-resolves api-a/api-b by itself, so the web tier can be replaced
    # without touching the API and vice versa.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 6
    mem_limit: 64m

volumes:
  pgdata:
  redisdata:
