# Indent Easy stack for one environment VM (DEV, QA or PROD), installed at /opt/indent-easy.
#
# Never started by hand in normal operation: the deploy agent (deploy.sh) runs
#   docker compose --env-file .env --env-file release.env up -d --wait
# where .env holds this environment's secrets (generated on the VM, never in Git) and
# release.env pins the exact image digest being deployed.
name: indent-easy

x-api-image: &api-image
  image: ${IE_IMAGE:?IE_IMAGE must be set by the deploy agent (release.env)}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: indent_easy
      POSTGRES_USER: ie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      IE_APP_PASSWORD: ${IE_APP_PASSWORD:?}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Gives the app role its login on first start of an empty volume.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ie -d indent_easy']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    shm_size: 128m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '96mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 128m

  # One-shot: applies pending migrations as the schema owner, then exits. The API only starts
  # after it succeeds.
  migrate:
    <<: *api-image
    command: ['dist/migrate.js']
    restart: 'no'
    read_only: true
    environment:
      MIGRATION_DATABASE_URL: postgres://ie:${POSTGRES_PASSWORD}@postgres:5432/indent_easy
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m

  api:
    <<: *api-image
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    ports:
      # No web front end yet: the API answers directly on port 80 of the VM.
      - '80:8080'
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?}
      PORT: '8080'
      METRICS_PORT: '9464'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      DATABASE_URL: postgres://ie_app:${IE_APP_PASSWORD}@postgres:5432/indent_easy
      DATABASE_POOL_MAX: '10'
      REDIS_URL: redis://redis:6379
      S3_BUCKET_DOCUMENTS: ie-documents
      S3_BUCKET_EXPORTS: ie-exports
      S3_BUCKET_IMPORTS: ie-imports
      S3_BUCKET_QUARANTINE: ie-quarantine
      JWT_SIGNING_KEYS: ${JWT_SIGNING_KEYS:?}
      CSRF_SECRET: ${CSRF_SECRET:?}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-25}
      MAIL_FROM: ${MAIL_FROM:-Indent Easy <no-reply@indent-easy.local>}
      GRAPHQL_INTROSPECTION: ${GRAPHQL_INTROSPECTION:-false}
      GRAPHQL_PERSISTED_ONLY: ${GRAPHQL_PERSISTED_ONLY:-false}
      MIN_MOBILE_VERSION: ${MIN_MOBILE_VERSION:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Ready = database, Redis and migrations OK (the image's own HEALTHCHECK is only liveness).
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 6
    stop_grace_period: 45s
    mem_limit: 512m

volumes:
  pgdata:
  redisdata:
