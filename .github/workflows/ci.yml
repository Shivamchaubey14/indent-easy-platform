name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Format, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Typecheck, unit tests and build
        run: pnpm turbo run typecheck test build
      - name: OpenAPI contract lint
        run: pnpm contracts:lint
      - name: No colour literals outside the design tokens
        run: sh scripts/ci/no-colour-literals.sh
      - name: Web first-load JavaScript within budget
        run: node scripts/ci/web-bundle-budget.mjs
      - name: Upload documentation site
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 14

  database:
    name: Migrations, invariants, RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: indent_easy
          POSTGRES_USER: ie
          POSTGRES_PASSWORD: ie_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ie -d indent_easy"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: ie
      PGPASSWORD: ie_ci_only
      PGDATABASE: indent_easy
      MIGRATION_DATABASE_URL: postgres://ie:ie_ci_only@localhost:5432/indent_easy
      DATABASE_URL: postgres://ie_app:ie_app_ci_only@localhost:5432/indent_easy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Give the app role a login
        run: sh database/init/10-app-role.sh
        env:
          POSTGRES_USER: ie
          POSTGRES_DB: indent_easy
          IE_APP_PASSWORD: ie_app_ci_only
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Schema and migrations agree (no drift)
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain database/migrations)" ]; then
            echo "::error::drizzle-kit generated a migration: packages/db/src/schema.ts and database/migrations disagree"
            git status --porcelain database/migrations
            exit 1
          fi
      - name: Seed
        run: for f in database/seeds/*.sql; do psql -X -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Database invariants
        run: sh scripts/ci/assert-db-smoke.sh
      - name: Integration tests (as the app role)
        run: pnpm test:integration

  image:
    name: API image build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # used only by the push step, which runs only for the dev branch
    env:
      IMAGE_REPO: ghcr.io/shivamchaubey14/indent-easy-api
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@v4
      # Scanners run as digest-pinned images rather than third-party actions, so a moved tag
      # cannot change what executes with this repository's token.
      - name: Lint the Dockerfile
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint - < infrastructure/docker/api.Dockerfile
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          tags: indent-easy/api:ci
          load: true
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            APP_VERSION=dev-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Scan for vulnerabilities (fail on High and Critical)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
            "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignorefile /.trivyignore \
            --exit-code 1 --no-progress indent-easy/api:ci
      - name: The image starts and answers its liveness probe
        run: |
          docker run -d --name api --read-only -p 8080:8080 \
            -e PUBLIC_BASE_URL=http://localhost -e CORS_ALLOWED_ORIGINS=http://localhost \
            -e DATABASE_URL=postgres://nobody@127.0.0.1:5432/none -e REDIS_URL=redis://127.0.0.1:6379 \
            -e S3_BUCKET_DOCUMENTS=ci-documents -e S3_BUCKET_EXPORTS=ci-exports -e S3_BUCKET_IMPORTS=ci-imports -e S3_BUCKET_QUARANTINE=ci-quarantine \
            -e SMTP_HOST=localhost -e MAIL_FROM=ci@example.invalid \
            indent-easy/api:ci
          for _ in $(seq 1 30); do curl -fs http://localhost:8080/health/live && exit 0; sleep 1; done
          docker logs api
          exit 1
      # Build once: the exact image that was scanned and boot-tested is pushed under its commit.
      # Environments never use sha- tags directly; promotion jobs point dev/qa/prod at them.
      - name: Push the image (dev branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag indent-easy/api:ci "$IMAGE_REPO:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE_REPO:sha-${GITHUB_SHA::7}"

  promote-dev:
    name: Release to DEV
    needs: [checks, database, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    environment:
      name: dev
    env:
      IMAGE_REPO: ghcr.io/shivamchaubey14/indent-easy-api
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Point the dev tag at this commit's image
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$IMAGE_REPO:dev" "$IMAGE_REPO:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$IMAGE_REPO:dev" --format '{{json .Manifest.Digest}}'
          echo "::notice::DEV will deploy sha-${GITHUB_SHA::7} within about two minutes"

  docs-deploy:
    name: Publish API docs
    needs: [checks, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs
      url: ${{ env.DOCS_URL }}
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: indent-easy-docs
      # If Cloudflare assigns a different *.pages.dev name, set the DOCS_URL repository variable.
      DOCS_URL: ${{ vars.DOCS_URL || 'https://indent-easy-docs.pages.dev' }}
      WRANGLER: npx --yes wrangler@4
    steps:
      - name: Skip when Cloudflare is not configured
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; docs not published"
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          sparse-checkout: scripts/ci
      - uses: actions/download-artifact@v4
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          name: api-docs
          path: dist
      - name: Create the Pages project on first run
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          if $WRANGLER pages project list 2>/dev/null | grep -q "$PAGES_PROJECT"; then
            echo "Pages project $PAGES_PROJECT exists"
          else
            $WRANGLER pages project create "$PAGES_PROJECT" --production-branch=main
          fi
      - name: Refuse to publish unless Cloudflare Access protects the site
        if: env.HAS_CLOUDFLARE == 'true'
        run: sh scripts/ci/assert-access-gate.sh "$DOCS_URL/"
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          $WRANGLER pages deploy dist --project-name="$PAGES_PROJECT" --branch=main \
            --commit-hash="$GITHUB_SHA" --commit-dirty=true | tee deploy.log
          echo "preview_url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      - name: Verify the published site and its preview URL are gated
        if: env.HAS_CLOUDFLARE == 'true'
        run: sh scripts/ci/assert-access-gate.sh "$DOCS_URL/" "$DOCS_URL/rest/openapi.yaml" ${{ steps.deploy.outputs.preview_url }}
