openapi: 3.1.0
info:
  title: Indent Easy REST API
  version: 1.0.0
  summary: Authentication, files, webhooks, integrations and health endpoints of Indent Easy.
  description: |
    GraphQL (`/graphql`) is the primary client API; this document covers the REST surface only.

    Conventions
    - Base path `/api/v1`; JSON UTF-8; timestamps RFC 3339 UTC.
    - Errors use RFC 9457 `application/problem+json` extended with `code`, `requestId`, `details`.
    - `X-Request-ID` is accepted/echoed; `traceparent` (W3C) is propagated.
    - `Idempotency-Key` is required where the operation says so. Reusing a key with a different
      request body returns 409 `IDEMPOTENCY_KEY_REUSED`; with the same body the original response is replayed.
    - Rate limits are advertised with `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset`
      and `Retry-After` on 429.
  contact:
    name: Indent Easy Architecture Team
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:4000
    description: Local development
  - url: http://dev.indent-easy.local
    description: DEV (integration of the dev branch)
  - url: http://qa.indent-easy.local
    description: QA (testing and user acceptance)
  - url: http://prod.indent-easy.local
    description: PROD (interim host; HTTPS and the final domain arrive with the office server)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Login, token refresh, logout, password flows
  - name: Files
    description: Pre-signed upload/download of documents
  - name: Exports
    description: Download of asynchronous exports
  - name: Webhooks
    description: Provider callbacks (SMS delivery reports, e-mail events). WhatsApp is out of scope (DEC-001).
  - name: Integrations
    description: Machine-to-machine SAP file exchange
  - name: Health
    description: Probes, metrics and build info

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Password login
      description: |
        Web clients receive the refresh token as an HttpOnly cookie `ie_rt` (Path=/api/v1/auth, SameSite=Strict, Secure);
        mobile clients (header `X-Client-Name: mobile-*`) receive it in the body. Generic error on bad credentials.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClientName'
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated (or MFA challenge required)
          headers:
            Set-Cookie:
              description: Refresh token cookie (web only)
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          description: Account locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      summary: Complete MFA challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                recoveryCode:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate refresh token and obtain a new access token
      description: |
        Web: refresh cookie + `X-CSRF-Token` header (value from `/auth/csrf`, double-submit).
        Mobile: `refreshToken` in body. Reuse of a rotated token revokes the whole token family.
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Mobile clients only
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: CSRF validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Issue CSRF token for cookie-authenticated auth endpoints
      security: []
      responses:
        '200':
          description: CSRF token (also set as non-HttpOnly cookie `ie_csrf`)
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke current session
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Revoke all sessions of the current user
      responses:
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revokedSessions:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request password reset e-mail (always 202)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted (identical response whether or not the account exists)
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        '204':
          description: Password changed; all sessions revoked
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '410':
          description: Token expired or already used
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
                  maxLength: 128
                revokeOtherSessions:
                  type: boolean
                  default: true
      responses:
        '204':
          description: Changed
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /.well-known/jwks.json:
    get:
      tags: [Auth]
      operationId: getJwks
      summary: JSON Web Key Set for access-token verification
      security: []
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /api/v1/files/upload-intents:
    post:
      tags: [Files]
      operationId: createUploadIntent
      summary: Create a document and obtain a pre-signed upload URL
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadIntentRequest'
      responses:
        '201':
          description: Upload intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntentResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: File exceeds the limit for the document type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: MIME type not allowed for the document type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/files/{documentId}/complete:
    post:
      tags: [Files]
      operationId: completeUpload
      summary: Confirm the object was uploaded; starts checksum verification and malware scan
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                multipartParts:
                  type: array
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber:
                        type: integer
                      etag:
                        type: string
      responses:
        '202':
          description: Accepted; status PENDING_SCAN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMeta'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Uploaded object missing or checksum mismatch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/files/{documentId}:
    get:
      tags: [Files]
      operationId: getDocument
      summary: Document metadata and status
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMeta'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/files/{documentId}/download:
    get:
      tags: [Files]
      operationId: downloadDocument
      summary: Redirect to a short-lived signed download URL
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: disposition
          in: query
          required: false
          schema:
            type: string
            enum: [inline, attachment]
            default: attachment
      responses:
        '302':
          description: Redirect to signed URL (expires in 300 s)
          headers:
            Location:
              schema:
                type: string
                format: uri
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Document not AVAILABLE (pending scan or quarantined)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/exports/{jobId}/download:
    get:
      tags: [Exports]
      operationId: downloadExport
      summary: Redirect to the export file
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to signed URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Export expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/webhooks/sms/{provider}:
    post:
      tags: [Webhooks]
      operationId: receiveSmsDeliveryReport
      summary: SMS delivery receipts (provider-specific body normalised by adapter; signature/shared-secret verified; monotonic status updates)
      security:
        - webhookSecret: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]{2,32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted
        '401':
          description: Authentication failed
        '404':
          description: Unknown provider

  /api/v1/webhooks/email/{provider}:
    post:
      tags: [Webhooks]
      operationId: receiveEmailEvents
      summary: E-mail bounce/complaint/delivery events
      security:
        - webhookSecret: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted
        '401':
          description: Authentication failed

  /api/v1/integrations/sap/po-files:
    post:
      tags: [Integrations]
      operationId: uploadSapPoFile
      summary: Machine upload of an SAP PO extract (creates an import batch)
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                autoCommit:
                  type: boolean
                  default: false
      responses:
        '202':
          description: Import batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: File too large
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/integrations/sap/sales-files:
    post:
      tags: [Integrations]
      operationId: uploadSapSalesFile
      summary: Machine upload of an SAP sale report for a payment cycle
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, sapCycleNumber]
              properties:
                file:
                  type: string
                  contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                sapCycleNumber:
                  type: string
      responses:
        '202':
          description: Import batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchStatus'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Cycle not found
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/integrations/sap/exports/grn:
    get:
      tags: [Integrations]
      operationId: pullGrnExport
      summary: Cursor-based pull of posted/verified GRNs and invoices for SAP
      security:
        - apiKey: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Page of GRN export records
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrnExportRecord'
                  nextCursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/integrations/import-batches/{batchId}:
    get:
      tags: [Integrations]
      operationId: getImportBatch
      summary: Import batch status
      security:
        - apiKey: []
        - bearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /health/live:
    get:
      tags: [Health]
      operationId: liveness
      summary: Liveness probe (process responsive; no dependency checks)
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/ready:
    get:
      tags: [Health]
      operationId: readiness
      summary: Readiness probe (PostgreSQL, Redis, migrations at expected version; not draining)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/startup:
    get:
      tags: [Health]
      operationId: startup
      summary: Startup probe
      security: []
      responses:
        '200':
          description: Started
        '503':
          description: Starting

  /metrics:
    get:
      tags: [Health]
      operationId: metrics
      summary: Prometheus metrics (cluster-internal only via NetworkPolicy)
      security: []
      responses:
        '200':
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

  /api/v1/version:
    get:
      tags: [Health]
      operationId: version
      summary: Build information
      security: []
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, graphqlSchemaHash, builtAt]
                properties:
                  version:
                    type: string
                  commit:
                    type: string
                  graphqlSchemaHash:
                    type: string
                  builtAt:
                    type: string
                    format: date-time
                  minMobileVersion:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
    ClientName:
      name: X-Client-Name
      in: header
      required: false
      schema:
        type: string
        examples: [web, mobile-android, mobile-ios]
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string

  responses:
    ValidationFailed:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.indent-easy/validation-failed
            title: Validation failed
            status: 400
            code: VALIDATION_FAILED
            detail: One or more fields are invalid.
            requestId: req-01926f6e8a1c
            details:
              fieldErrors:
                - path: [sizeBytes]
                  message: Must be less than or equal to 10485760
    Unauthorized:
      description: Authentication required or failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not permitted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (also used when the caller may not know the resource exists)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict (idempotency key reuse, version conflict, duplicate)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected error (no internal details exposed)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code (same catalogue as GraphQL ErrorCode)
        requestId:
          type: string
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: E-mail address or employee code
          maxLength: 254
        password:
          type: string
          maxLength: 128
        deviceName:
          type: string
          maxLength: 100

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, sessionId]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds until access-token expiry
        sessionId:
          type: string
        refreshToken:
          type: string
          description: Present only for mobile clients
        refreshExpiresIn:
          type: integer
        mustChangePassword:
          type: boolean

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeToken, methods]
      properties:
        mfaRequired:
          type: boolean
          const: true
        challengeToken:
          type: string
        methods:
          type: array
          items:
            type: string
            enum: [TOTP, SMS_OTP, RECOVERY_CODE]

    UploadIntentRequest:
      type: object
      required: [documentType, fileName, mimeType, sizeBytes, sha256]
      properties:
        documentType:
          type: string
          examples: [CHALLAN, INVOICE, POD, EWAY_BILL, APPROVAL_EVIDENCE, IMPORT_FILE]
        fileName:
          type: string
          maxLength: 255
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        entityType:
          type: string
        entityId:
          type: string
        existingDocumentId:
          type: string
          description: Upload a new version of an existing document
        multipart:
          type: boolean
          default: false

    UploadIntentResponse:
      type: object
      required: [documentId, versionNo, upload]
      properties:
        documentId:
          type: string
        versionNo:
          type: integer
        upload:
          type: object
          required: [method, expiresAt]
          properties:
            method:
              type: string
              enum: [PUT, MULTIPART]
            url:
              type: string
              format: uri
            headers:
              type: object
              additionalProperties:
                type: string
            parts:
              type: array
              items:
                type: object
                required: [partNumber, url]
                properties:
                  partNumber:
                    type: integer
                  url:
                    type: string
                    format: uri
            expiresAt:
              type: string
              format: date-time

    DocumentMeta:
      type: object
      required: [documentId, typeCode, fileName, mimeType, sizeBytes, status, versionNo]
      properties:
        documentId:
          type: string
        typeCode:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
        sha256:
          type: string
        status:
          type: string
          enum: [PENDING_UPLOAD, PENDING_SCAN, AVAILABLE, QUARANTINED, SUPERSEDED, DELETED]
        versionNo:
          type: integer
        uploadedAt:
          type: string
          format: date-time

    ImportBatchStatus:
      type: object
      required: [batchId, kind, status]
      properties:
        batchId:
          type: string
        kind:
          type: string
          enum: [PRODUCT_MAPPING, VENDOR_PRODUCT, MPP_MASTER, SAP_PO, SAP_SALES, RECON_SHEET, OPENING_STOCK, INDENT_BULK]
        status:
          type: string
        totalRows:
          type: integer
        processedRows:
          type: integer
        succeededRows:
          type: integer
        failedRows:
          type: integer
        errorReportUrl:
          type: [string, 'null']
          format: uri

    GrnExportRecord:
      type: object
      required: [grnNumber, postedAt, vendorCode, lines]
      properties:
        grnNumber:
          type: string
        postedAt:
          type: string
          format: date-time
        externalPoNumber:
          type: [string, 'null']
        vendorCode:
          type: string
        plant:
          type: string
        invoiceNumber:
          type: [string, 'null']
        lines:
          type: array
          items:
            type: object
            required: [materialCode, quantityAccepted, uom]
            properties:
              materialCode:
                type: string
              quantityAccepted:
                type: string
              quantityRejected:
                type: string
              uom:
                type: string
              unitPrice:
                type: [string, 'null']

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, fail]
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
              latencyMs:
                type: integer
